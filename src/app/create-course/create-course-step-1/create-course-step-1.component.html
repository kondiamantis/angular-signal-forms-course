<div class="field">
  <label>Course Title</label>
  <input placeholder="Course title">
  <div class="hint">0 / 60</div>
</div>

<div class="field">
  <label>Category</label>
  <select>
    @for (cat of courseCategories(); track cat.code) {
      <option [value]="cat.code">{{ cat.description }}</option>
    }
  </select>
</div>

<div class="field">
  <label>Release Date</label>
  <input type="date">
</div>

<div class="field inline">
  <input type="checkbox" id="downloads">
  <label for="downloads">Downloads allowed?</label>
</div>

<div class="field">
  <label>Description</label>
  <textarea placeholder="Course description" rows="4"></textarea>
</div>
